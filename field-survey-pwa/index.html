<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c3d36">
    <meta name="description" content="PWA điều tra thực địa offline-first: lưu khảo sát trên thiết bị và đồng bộ Google Sheets khi có Internet.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Field Survey">
    <title>Field Survey · VKU</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
  </head>
  <body>
    <div id="splash" aria-hidden="false">
      <div>
        <div class="splash-mark">📋</div>
        <h1>Field Survey</h1>
        <p>Một mã nguồn · chạy trên Web và cài như App</p>
      </div>
    </div>

    <div id="app">
      <header class="app-header">
        <a href="#/">FIELD SURVEY</a>
        <div class="header-actions">
          <span class="mode-pill" data-runtime-mode>Web</span>
          <span class="network-pill" data-network-pill>
            <span class="dot"></span> Online
          </span>
          <a class="header-settings" href="#/settings" title="Cài đặt" aria-label="Cài đặt">
            ⚙ Cài đặt
          </a>
        </div>
      </header>

      <p id="offline-banner" hidden>
        🔴 Offline — bạn vẫn làm khảo sát được. Dữ liệu lưu trên thiết bị và sẽ tự đồng bộ khi có mạng.
      </p>

      <main id="view" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Điều hướng chính">
        <a href="#/" data-nav="home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          Home
        </a>
        <a href="#/surveys" data-nav="surveys">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 4h10a2 2 0 0 1 2 2v14l-3.2-2-3.8 2-3.8-2L5 20V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          Khảo sát
        </a>
        <a href="#/history" data-nav="history">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 8v5l3 2" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          Lịch sử
        </a>
        <a href="#/sync" data-nav="sync">
          <span class="nav-badge" data-pending-count hidden>0</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 17a6 6 0 1 1 1.2-11.9A5 5 0 0 1 20 10.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M16 14v6m0 0 2.5-2.5M16 20l-2.5-2.5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          Đồng bộ
        </a>
      </nav>
    </div>

    <div id="toast-root" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
